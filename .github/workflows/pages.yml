# Tự động đưa thư mục dist/ lên GitHub Pages mỗi khi push lên nhánh main.
# Cần bật 1 lần: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy website lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # dist/ đã build sẵn (ảnh/video tối ưu nằm trên git) → không cần chạy npm trên máy chủ
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
